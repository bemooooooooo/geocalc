version: "3.9"

services:
  # PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: geocalc_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: geocalc
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./server/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Go API
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: geocalc_server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: geocalc
      PORT: 8080
      AUTH_SECRET: geocalc-local-secret-change-me
    ports:
      - "8080:8080"

  # React
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: geocalc_client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "3000:80"

volumes:
  pg_data:
